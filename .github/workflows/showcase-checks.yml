name: Showcase Sample Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  examples-and-docs:
    name: Public examples and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out curated showcase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Install educational sample dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-demo.txt
          python -m pip check
      - name: Test public Python examples
        run: python -m pytest tests/test_public_samples.py tests/test_api_public_sample.py -q
      - name: Validate Markdown references and Mermaid fences
        run: python scripts/validate_markdown.py
